<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typotheque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top">
    <div class="logo">
        <img class="fotologo" src="img/logo.png">
    </div>
    <div class="menu">
        <img class="fotomenu" src="img/hamburger.png">
    </div>
    <div class="login">
        <p class="logintekst">Log in</p>
    </div>
    <div class="zoeken">
        <img class="zoekenfoto" src="img/seek.png">
    </div>
    </header>
    <div class="slider"></div>


    <div class="parent">
    <div class="div1">
        <p class="fonts1">All fonts</p>
        <img class="div1img" src="img/grid1.png" alt="All Fonts">
        <p class ="d1">Browse</p>
    </div>

    <div class="div2">
        <p class="fonts2" >Global Fonts</p>
        <img class="div2img" src="img/grid2.png" alt="Global Fonts">
        <p class ="d2">Browse</p>
    </div>

    <div class="div3"> 
        <p class="fonts3">Variable Fonts</p>
        <img class="div3img" src="img/grid3.png" alt="Variable Fonts">
        <p class ="d3">Browse</p>
    </div>

    <div class="div4"> 
        <p class="fonts4">Smart Fonts</p>
        <img class="div4img" src="img/grid4.png" alt="Smart Fonts">
        <p class ="d4">Browse</p>
    </div>

    <div class="div5">
        <p class="fonts5">Superfamilies</p>
        <img class="div5img" src="img/grid5.png" alt="superfamilies">
        <p class ="d5">Browse</p>
    </div>

    <div class="div6">
        <p class="fonts6">Legibility Fonts</p>
        <img class="div6img" src="img/grid6.png" alt="legibility Fonts">
        <p class ="d6">Browse</p>
    </div>
    
    <div class="div7"> 
        <p class="fonts7">Optical Sizes</p>
        <img class="div7img" src="img/grid7.png" alt="Optical Sizes">
        <p class ="d7">Browse</p>
    </div>
</div>
</div>
</body>
</html>
